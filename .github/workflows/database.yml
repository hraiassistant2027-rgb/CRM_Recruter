# Перевірка і розгортання бази даних.
# - На кожен pull request: чиста БД → усі міграції → тести прав доступу.
# - Після злиття в main: міграції застосовуються до staging, потім до production
#   (production чекає підтвердження в GitHub → Environments → production → Required reviewers).
# Секрети вводяться в GitHub (Settings → Secrets and variables → Actions), у коді їх немає.

name: database

on:
  pull_request:
    paths: ['supabase/**']
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Міграції та тести прав доступу
        run: ./supabase/tests/run_local.sh

  deploy-staging:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Резервна копія схеми перед змінами
        run: supabase db dump --linked -f pre_deploy_schema.sql
      - uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-schema-${{ github.sha }}
          path: pre_deploy_schema.sql
          retention-days: 90
      - run: supabase db push
