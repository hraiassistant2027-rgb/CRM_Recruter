# Перевірка і розгортання бази даних.
# - На кожен pull request: чиста БД → усі міграції → тести прав доступу.
# - Після злиття в main: міграції застосовуються до staging, потім до production
#   (production чекає підтвердження в GitHub → Environments → production → Required reviewers).
# Секрети вводяться в GitHub (Settings → Secrets and variables → Actions), у коді їх немає.
# Поки ключі не введено, розгортання пропускається з попередженням, а не падає.

name: database

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/database.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/database.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Міграції та тести прав доступу
        run: ./supabase/tests/run_local.sh

  deploy-staging:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      ready: ${{ steps.cfg.outputs.ready }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Перевірка налаштувань
        id: cfg
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning title=Розгортання пропущено::Не введено ключі для staging (SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF). Див. інструкцію з реєстрації акаунтів, крок 4."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./.github/scripts/check_token.sh staging
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        if: steps.cfg.outputs.ready == 'true'
        with:
          version: latest
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase link --project-ref "$PROJECT_REF"
      - if: steps.cfg.outputs.ready == 'true'
        run: supabase db push --remote --yes

  deploy-production:
    needs: deploy-staging
    if: needs.deploy-staging.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Перевірка налаштувань
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error title=Немає ключів production::Введіть SUPABASE_DB_PASSWORD і SUPABASE_PROJECT_REF у середовищі production."
            exit 1
          fi
          ./.github/scripts/check_token.sh production
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$PROJECT_REF"
      - name: Резервна копія схеми перед змінами
        run: supabase db dump --linked -f pre_deploy_schema.sql
      - uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-schema-${{ github.sha }}
          path: pre_deploy_schema.sql
          retention-days: 90
      - run: supabase db push --remote --yes
