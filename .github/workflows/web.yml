name: web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Фіктивні значення лише для збирання; справжні ключі задаються на хостингу
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Встановлення залежностей
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Перевірка типів
        run: npm run typecheck
      - name: Модульні тести
        run: npm test
      - name: Збирання
        run: npm run build
      - name: Lock-файл (для фіксації версій)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: web/package-lock.json
          if-no-files-found: ignore
